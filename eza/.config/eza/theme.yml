# Overrides for file icons (requires Nerd Fonts)
filenames:
  ".bashrc":
    filename:
      foreground: "#89E051"
      is_italic: true
      is_bold: true
    icon:
      glyph: ""
      style: { foreground: "#89E051" }
      is_italic: true

  ".bash_aliases":
    filename:
      foreground: "#89E051"
      is_italic: true
      is_bold: true
    icon:
      glyph: ""
      style: { foreground: "#89E051" }
      is_italic: true
