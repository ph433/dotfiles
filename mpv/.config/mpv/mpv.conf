# --- TỐI ƯU CHỈ PHÁT NHẠC ---
# Dùng 'video=no' để tắt hẳn cửa sổ video
video=no

# Chỉ lấy luồng âm thanh tốt nhất, bỏ qua toàn bộ video
ytdl-raw-options=format="bestaudio/best"

# --- TỐI ƯU LẶP LẠI (LOOP) ---
# Lặp lại file hiện tại vô hạn
loop-file=inf

# --- TỐI ƯU BỘ NHỚ ĐỆM (CACHE) ---
cache=yes
demuxer-max-bytes=200M
demuxer-max-back-bytes=200M

# Đảm bảo không mở cửa sổ window
force-window=no
